        <span class="brand-badge" aria-hidden="true">E</span>

      <nav class="nav" aria-label="Primary navigation">

  <main id="main">
    <section class="auth-wrap">
      <div class="auth-card">
        <h1 class="auth-title">Register</h1>
        <p class="auth-subtitle">Create an account to continue into EncryptEd.</p>

        <form class="form" action="connect.php" method="post">
          <div class="form-input">
            <input type="text" name="firstname" placeholder="First Name" required>
          </div>

          <div class="form-input">
           <input type="text" name="username" placeholder="Username" required>
          </div>

          <div class="form-input">
            <input type="password" name="password" placeholder="Password" required>
          </div>

          <label class="checkbox-row" for="remember">
            <input id="remember" type="checkbox" name="remember" value="yes">
            Remember me
          </label>

          <button class="btn primary" type="submit">Sign Up</button>

          <p class="helper">Already have an account? This is a UI-only placeholder page.</p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>EncryptEd draft UI • Sign In</p>
    </div>
  </footer>
